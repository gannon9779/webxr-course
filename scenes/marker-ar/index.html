<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>How a Message Rides a Wave</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  .a-enter-vr { display: none; }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 14px 18px 22px; text-align: center; color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
    pointer-events: none;
  }
  #scheme  { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  #explain { font-size: 15px; opacity: .92; margin-top: 4px; }
  #tap     { font-size: 13px; opacity: .6; margin-top: 10px; }
  #legend  { font-size: 13px; margin-top: 8px; opacity: .9; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
        margin: 0 5px 0 14px; vertical-align: -1px; }
</style>
</head>
<body>

<script>
/* ────────────────────────────────────────────────────────────
   modulated-wave
   One carrier wave carrying a text message, drawn four ways.
   ──────────────────────────────────────────────────────────── */
AFRAME.registerComponent('modulated-wave', {
  schema: {
    message:    { default: 'HI' },
    scheme:     { default: 'ASK' },          // ASK | FSK | PSK | QAM
    length:     { default: 7.0 },
    amplitude:  { default: 0.75 },
    cyclesPerBit: { default: 1.6 },
    samples:    { default: 400 },
    thickness:  { default: 0.016 },
    speed:      { default: 0.5 },
    oneColor:   { type: 'color', default: '#FFB300' },
    zeroColor:  { type: 'color', default: '#29B6F6' },
    lineColor:  { type: 'color', default: '#FFFFFF' },
    axisColor:  { type: 'color', default: '#9E9E9E' }
  },

  init: function () {
    this.dummy = new THREE.Object3D();
    this.color = new THREE.Color();
    this.markerEl = this.el.closest('a-marker');
  },

  update: function (oldData) {
    const d = this.data;
    const rebuild = !oldData
      || oldData.message   !== d.message
      || oldData.samples   !== d.samples
      || oldData.length    !== d.length
      || oldData.thickness !== d.thickness;
    if (rebuild) { this.build(); }
  },

  /* message -> array of bits, 8 per character */
  bitsFromMessage: function (msg) {
    const bits = [];
    for (let c = 0; c < msg.length; c++) {
      const code = msg.charCodeAt(c);
      for (let b = 7; b >= 0; b--) { bits.push((code >> b) & 1); }
    }
    return bits;
  },

  build: function () {
    const d = this.data;
    this.destroy();

    this.bits = this.bitsFromMessage(d.message);
    this.samplesPerBit = Math.max(2, Math.floor(d.samples / this.bits.length));
    this.nSamples = this.samplesPerBit * this.bits.length;

    const group = new THREE.Group();
    const geo = new THREE.BoxGeometry(d.thickness, 1, d.thickness);
    const mat = new THREE.MeshBasicMaterial();

    this.stems = new THREE.InstancedMesh(geo, mat, this.nSamples);
    this.stems.frustumCulled = false;
    group.add(this.stems);

    /* colour each stem by the bit it belongs to — fixed, set once */
    for (let i = 0; i < this.nSamples; i++) {
      const bit = this.bits[Math.floor(i / this.samplesPerBit)];
      this.color.set(bit ? d.oneColor : d.zeroColor);
      this.stems.setColorAt(i, this.color);
    }
    if (this.stems.instanceColor) { this.stems.instanceColor.needsUpdate = true; }

    /* outline tracing the top of the wave */
    this.linePos = new Float32Array(this.nSamples * 3);
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.BufferAttribute(this.linePos, 3));
    this.line = new THREE.Line(lineGeo,
      new THREE.LineBasicMaterial({ color: new THREE.Color(d.lineColor) }));
    group.add(this.line);

    /* centre axis */
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-d.length / 2, 0, 0),
      new THREE.Vector3( d.length / 2, 0, 0)
    ]);
    group.add(new THREE.Line(axisGeo,
      new THREE.LineBasicMaterial({ color: new THREE.Color(d.axisColor) })));

    this.el.setObject3D('wave', group);
  },

  tick: function (time) {
    if (!this.stems) { return; }
    if (this.markerEl && !this.markerEl.object3D.visible) { return; }

    const d  = this.data;
    const t  = time / 1000;
    const dx = d.length / (this.nSamples - 1);
    const x0 = -d.length / 2;
    const bitWidth = d.length / this.bits.length;

    /* base carrier: how fast the wave wiggles per unit of x */
    const baseK = (2 * Math.PI * d.cyclesPerBit) / bitWidth;
    const omega = 2 * Math.PI * d.speed;

    const dummy = this.dummy;
    let phase = 0;                       // accumulated so FSK stays smooth

    for (let i = 0; i < this.nSamples; i++) {
      const x      = x0 + i * dx;
      const bitIdx = Math.floor(i / this.samplesPerBit);
      const bit    = this.bits[bitIdx];

      let amp = d.amplitude;
      let k   = baseK;
      let off = 0;

      switch (d.scheme) {

        /* HEIGHT — tall for a 1, short for a 0 */
        case 'ASK':
          amp = bit ? d.amplitude : d.amplitude * 0.22;
          break;

        /* SPEED — quick wiggle for a 1, slow for a 0 */
        case 'FSK':
          k = bit ? baseK * 1.8 : baseK * 0.75;
          break;

        /* FLIP — upside down for a 0 */
        case 'PSK':
          off = bit ? 0 : Math.PI;
          break;

        /* BOTH — two bits at once: height from one, flip from the other */
        case 'QAM': {
          const pairStart = bitIdx - (bitIdx % 2);
          const hiBit = this.bits[pairStart];
          const loBit = this.bits[pairStart + 1] !== undefined
                        ? this.bits[pairStart + 1] : 0;
          amp = hiBit ? d.amplitude : d.amplitude * 0.45;
          off = loBit ? 0 : Math.PI;
          break;
        }
      }

      phase += k * dx;
      const y = amp * Math.sin(phase - omega * t + off);
      const len = Math.abs(y) || 1e-4;

      dummy.position.set(x, y / 2, 0);
      dummy.scale.set(1, len, 1);
      dummy.updateMatrix();
      this.stems.setMatrixAt(i, dummy.matrix);

      this.linePos[i * 3]     = x;
      this.linePos[i * 3 + 1] = y;
      this.linePos[i * 3 + 2] = 0;
    }

    this.stems.instanceMatrix.needsUpdate = true;
    this.line.geometry.attributes.position.needsUpdate = true;
  },

  destroy: function () {
    if (this.el.getObject3D('wave')) { this.el.removeObject3D('wave'); }
    this.stems = null;
  },

  remove: function () { this.destroy(); }
});


/* ────────────────────────────────────────────────────────────
   Tap anywhere to change how the message is carried
   ──────────────────────────────────────────────────────────── */
AFRAME.registerComponent('scheme-switcher', {
  init: function () {
    this.modes = [
      { id: 'ASK', title: 'HEIGHT',
        text: 'A tall wave means 1. A short wave means 0.' },
      { id: 'FSK', title: 'SPEED',
        text: 'A fast wiggle means 1. A slow wiggle means 0.' },
      { id: 'PSK', title: 'FLIP',
        text: 'The wave flips upside down to mark a 0.' },
      { id: 'QAM', title: 'BOTH AT ONCE',
        text: 'Height and flip together, so each wave carries twice as much.' }
    ];
    this.i = 0;
    this.apply();
    document.addEventListener('click', () => {
      this.i = (this.i + 1) % this.modes.length;
      this.apply();
    });
  },

  apply: function () {
    const m = this.modes[this.i];
    document.querySelector('#wave').setAttribute('modulated-wave', 'scheme', m.id);
    document.querySelector('#scheme').textContent  = m.title;
    document.querySelector('#explain').textContent = m.text;
    const label = document.querySelector('#schemeLabel');
    if (label) { label.setAttribute('value', m.title); }
  }
});


/* fills in the on-screen bit string once the scene is ready */
AFRAME.registerComponent('bit-readout', {
  init: function () {
    this.el.sceneEl.addEventListener('loaded', () => {
      const comp = document.querySelector('#wave').components['modulated-wave'];
      if (!comp || !comp.bits) { return; }
      const msg = comp.data.message;
      let grouped = '';
      comp.bits.forEach((b, i) => {
        grouped += b + ((i % 8 === 7 && i < comp.bits.length - 1) ? '  ' : '');
      });
      this.el.setAttribute('value', grouped);
      const m = document.querySelector('#msgLabel');
      if (m) { m.setAttribute('value', '"' + msg + '"'); }
    });
  }
});
</script>


<a-scene embedded
         arjs="sourceType: webcam; debugUIEnabled: false"
         vr-mode-ui="enabled: false"
         renderer="antialias: true; alpha: true"
         scheme-switcher>

  <a-marker preset="hiro">
    <a-entity scale="0.12 0.12 0.12" position="0 0.5 0">

      <!-- the message, as a word -->
      <a-text id="msgLabel" value='"HI"' color="#FFFFFF" align="center"
              position="0 1.9 0" scale="1.6 1.6 1.6"></a-text>

      <a-text value="becomes" color="#BDBDBD" align="center"
              position="0 1.45 0" scale="0.7 0.7 0.7"></a-text>

      <!-- the bits -->
      <a-text id="bitLabel" bit-readout value="" color="#E0E0E0" align="center"
              position="0 1.15 0" scale="0.85 0.85 0.85"></a-text>

      <!-- the wave -->
      <a-entity id="wave" modulated-wave="message: HI" position="0 0 0"></a-entity>

      <!-- current mode, floating under the wave -->
      <a-text id="schemeLabel" value="HEIGHT" color="#FFFFFF" align="center"
              position="0 -1.25 0" scale="1.3 1.3 1.3"></a-text>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>


<div id="panel">
  <div id="scheme">HEIGHT</div>
  <div id="explain">A tall wave means 1. A short wave means 0.</div>
  <div id="legend">
    <span class="sw" style="background:#FFB300"></span>1
    <span class="sw" style="background:#29B6F6"></span>0
  </div>
  <div id="tap">Tap anywhere to change how the message is carried</div>
</div>

</body>
</html>
